<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Codex Token Observer</title>
  <style>
    :root{--bg:#f3f5f2;--panel:#fff;--ink:#16211c;--muted:#66736c;--line:#dce3de;--green:#176b4d;--mint:#d9efe5;--amber:#b86e17;--blue:#356a9a;--red:#a44a3f;--shadow:0 14px 40px rgba(28,48,38,.08)}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0,#dfede5 0,transparent 32%),var(--bg);color:var(--ink);font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif}button,select,input{font:inherit}.wrap{max-width:1420px;margin:auto;padding:34px 28px 60px}.top{display:flex;justify-content:space-between;gap:24px;align-items:end;margin-bottom:24px}.eyebrow{color:var(--green);font-weight:750;letter-spacing:.09em;font-size:12px;text-transform:uppercase}h1{font-size:clamp(29px,4vw,46px);margin:5px 0 7px;letter-spacing:-.035em}.sub{color:var(--muted);margin:0;max-width:720px}.refresh{border:1px solid var(--ink);background:var(--ink);color:white;border-radius:12px;padding:11px 18px;cursor:pointer}.filters{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:12px;background:rgba(255,255,255,.75);padding:14px;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin-bottom:16px}.field label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px}.field select,.field input{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;color:var(--ink)}.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:16px 0}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.card{padding:18px}.card .label{color:var(--muted);font-size:13px}.card .value{font-size:25px;font-weight:760;margin:7px 0 3px}.card .hint{font-size:11px;color:var(--muted)}.grid{display:grid;grid-template-columns:1.65fr 1fr;gap:16px}.panel{padding:20px;min-width:0}.panel h2{font-size:17px;margin:0 0 4px}.panel-note{font-size:12px;color:var(--muted);margin-bottom:16px}.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:8px 0}.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px}.chart{height:290px;position:relative}.chart svg{width:100%;height:100%;overflow:visible}.axis{stroke:#dfe5e1;stroke-width:1}.chart-label{font-size:11px;fill:#748079}.empty{height:250px;display:grid;place-items:center;color:var(--muted)}.table-panel{margin-top:16px}.table-wrap{overflow:auto;max-height:520px}table{width:100%;border-collapse:collapse;font-size:13px}th{position:sticky;top:0;background:#f8faf8;text-align:right;color:var(--muted);font-weight:650;padding:11px;border-bottom:1px solid var(--line)}th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}td{text-align:right;padding:12px 11px;border-bottom:1px solid #edf0ee;white-space:nowrap}.session{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--green)}.project{font-weight:650}.source{display:inline-block;background:var(--mint);color:var(--green);border-radius:999px;padding:3px 8px;font-size:11px}.footer{color:var(--muted);font-size:11px;margin-top:14px}.error{background:#fff0ed;color:var(--red);padding:16px;border:1px solid #f1c8c1;border-radius:12px}.bar-row{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center;margin:12px 0;font-size:12px}.bar-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.track{height:12px;background:#edf1ee;border-radius:99px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--green),#55a77f);border-radius:99px}.bar-value{text-align:right;font-variant-numeric:tabular-nums}.tooltip{position:fixed;display:none;pointer-events:none;background:#132019;color:white;padding:8px 10px;border-radius:8px;font-size:11px;box-shadow:var(--shadow);z-index:5}
    @media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.filters{grid-template-columns:1fr}.top{align-items:start;flex-direction:column}.bar-row{grid-template-columns:110px 1fr 64px}.wrap{padding:24px 14px 40px}}
  </style>
</head>
<body><main class="wrap">
  <header class="top"><div><div class="eyebrow">Local usage telemetry</div><h1>Codex Token Observer</h1><p class="sub">按会话、项目与时间查看本机 Codex token 使用。输入包含缓存输入；总 token 使用日志原始口径。</p></div><button class="refresh" id="refresh">刷新数据</button></header>
  <section class="filters" aria-label="筛选"><div class="field"><label for="project">项目</label><select id="project"><option value="">全部项目</option></select></div><div class="field"><label for="kind">记录类型</label><select id="kind"><option value="">主会话 + 子代理运行</option><option value="main">仅主会话</option><option value="subagent">仅子代理运行</option></select></div><div class="field"><label for="from">开始日期</label><input type="date" id="from"></div><div class="field"><label for="to">结束日期</label><input type="date" id="to"></div></section>
  <div id="error"></div><section class="kpis" id="kpis"></section>
  <section class="grid"><article class="panel"><h2>时间趋势</h2><div class="panel-note">按本地日期汇总所选记录的 token 增量</div><div class="legend"><span><i class="dot" style="background:#176b4d"></i>总 token</span><span><i class="dot" style="background:#356a9a"></i>非缓存输入</span><span><i class="dot" style="background:#b86e17"></i>输出</span></div><div class="chart" id="chart"></div></article><article class="panel"><h2>使用分布</h2><div class="panel-note">总 token 最高的 8 个主会话或子代理运行</div><div id="bars"></div></article></section>
  <section class="panel table-panel"><h2>主会话与子代理运行</h2><div class="panel-note" id="count"></div><div class="table-wrap"><table><thead><tr><th>记录 / 项目</th><th>最近活动</th><th>类型</th><th>输入</th><th>缓存输入</th><th>非缓存</th><th>输出</th><th>总 token</th></tr></thead><tbody id="rows"></tbody></table></div><div class="footer" id="meta"></div></section>
</main><div class="tooltip" id="tip"></div>
<script>
let data=null;const n=v=>new Intl.NumberFormat('zh-CN',{notation:v>=1e6?'compact':'standard',maximumFractionDigits:1}).format(v||0);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const localDay=iso=>new Date(iso).toLocaleDateString('sv-SE');
async function load(){document.getElementById('refresh').disabled=true;try{let r=await fetch('/api/data',{cache:'no-store'}),j=await r.json();if(!r.ok)throw Error(j.error||'数据不可用');data=j;document.getElementById('error').innerHTML='';populate();render()}catch(e){document.getElementById('error').innerHTML=`<div class="error">${esc(e.message)}</div>`}finally{document.getElementById('refresh').disabled=false}}
function populate(){let select=document.getElementById('project'),value=select.value,projects=[...new Set(data.sessions.map(s=>s.project))].sort((a,b)=>a.localeCompare(b,'zh-CN'));select.innerHTML='<option value="">全部项目</option>'+projects.map(p=>`<option>${esc(p)}</option>`).join('');select.value=projects.includes(value)?value:''}
function filtered(){let project=document.getElementById('project').value,kind=document.getElementById('kind').value,from=document.getElementById('from').value,to=document.getElementById('to').value;let inRange=iso=>{let d=localDay(iso);return(!from||d>=from)&&(!to||d<=to)};let sessions=data.sessions.filter(s=>(!project||s.project===project)&&(!kind||s.kind===kind)&&inRange(s.lastAt));let ids=new Set(sessions.map(s=>s.id));let points=data.timeline.filter(p=>ids.has(p.sessionId)&&inRange(p.timestamp));return{sessions,points}}
function sums(points){let keys=['input_tokens','cached_input_tokens','uncached_input_tokens','output_tokens','reasoning_output_tokens','total_tokens'],o=Object.fromEntries(keys.map(k=>[k,0]));points.forEach(p=>keys.forEach(k=>o[k]+=p[k]||0));return o}
function render(){let {sessions,points}=filtered(),total=sums(points),cards=[['总 token','total_tokens','日志报告总量'],['输入','input_tokens','包含缓存输入'],['缓存输入','cached_input_tokens','输入中的缓存部分'],['非缓存输入','uncached_input_tokens','输入减缓存输入'],['输出','output_tokens',`推理输出 ${n(total.reasoning_output_tokens)}`]];document.getElementById('kpis').innerHTML=cards.map(([l,k,h])=>`<article class="card"><div class="label">${l}</div><div class="value">${n(total[k])}</div><div class="hint">${h}</div></article>`).join('');renderChart(points);renderBars(sessions);renderTable(sessions);document.getElementById('meta').textContent=`更新于 ${new Date(data.generatedAt).toLocaleString()} · 扫描 ${data.filesScanned} 个日志 · ${data.parseErrors} 条无法解析的记录 · 数据仅来自本机日志`}
function renderChart(points){let daily={};points.forEach(p=>{let d=localDay(p.timestamp),x=daily[d]??={total:0,uncached:0,output:0};x.total+=p.total_tokens;x.uncached+=p.uncached_input_tokens;x.output+=p.output_tokens});let rows=Object.entries(daily).sort((a,b)=>a[0].localeCompare(b[0]));let el=document.getElementById('chart');if(!rows.length){el.innerHTML='<div class="empty">当前筛选范围没有 token 记录</div>';return}let W=760,H=275,pad={l:54,r:16,t:12,b:34},max=Math.max(...rows.map(r=>r[1].total),1),x=i=>pad.l+(W-pad.l-pad.r)*(rows.length===1?.5:i/(rows.length-1)),y=v=>H-pad.b-(H-pad.t-pad.b)*v/max,path=key=>rows.map((r,i)=>(i?'L':'M')+x(i)+','+y(r[1][key])).join(' ');let ticks=[0,.25,.5,.75,1];el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Token 时间趋势">${ticks.map(t=>`<line class="axis" x1="${pad.l}" y1="${y(max*t)}" x2="${W-pad.r}" y2="${y(max*t)}"/><text class="chart-label" x="${pad.l-7}" y="${y(max*t)+4}" text-anchor="end">${n(max*t)}</text>`).join('')}<path d="${path('total')}" fill="none" stroke="#176b4d" stroke-width="3"/><path d="${path('uncached')}" fill="none" stroke="#356a9a" stroke-width="2"/><path d="${path('output')}" fill="none" stroke="#b86e17" stroke-width="2"/>${rows.map((r,i)=>`<circle class="point" data-i="${i}" cx="${x(i)}" cy="${y(r[1].total)}" r="5" fill="#176b4d"/><text class="chart-label" x="${x(i)}" y="${H-10}" text-anchor="middle">${rows.length<9||i%Math.ceil(rows.length/7)===0?r[0].slice(5):''}</text>`).join('')}</svg>`;let tip=document.getElementById('tip');el.querySelectorAll('.point').forEach(c=>c.onmousemove=e=>{let [d,v]=rows[+c.dataset.i];tip.style.display='block';tip.style.left=e.clientX+12+'px';tip.style.top=e.clientY+12+'px';tip.innerHTML=`${d}<br>总量 ${n(v.total)}<br>非缓存输入 ${n(v.uncached)}<br>输出 ${n(v.output)}`});el.onmouseleave=()=>tip.style.display='none'}
function parentOf(s){return s.parentThreadId?data.sessions.find(x=>x.id===s.parentThreadId):null}function displayName(s){if(s.kind==='main')return s.title||s.project;let p=parentOf(s);return(p?.title||p?.project||s.project)+' · 子代理'}
function renderBars(sessions){let rows=[...sessions].sort((a,b)=>b.usage.total_tokens-a.usage.total_tokens).slice(0,8),max=Math.max(...rows.map(s=>s.usage.total_tokens),1);document.getElementById('bars').innerHTML=rows.length?rows.map(s=>`<div class="bar-row" title="${esc(s.cwd)}"><div class="bar-label">${esc(displayName(s))}</div><div class="track"><div class="fill" style="width:${100*s.usage.total_tokens/max}%"></div></div><div class="bar-value">${n(s.usage.total_tokens)}</div></div>`).join(''):'<div class="empty">没有会话</div>'}
function renderTable(sessions){let mains=sessions.filter(s=>s.kind==='main').length,subs=sessions.filter(s=>s.kind==='subagent').length;document.getElementById('count').textContent=`${mains} 个主会话 · ${subs} 个子代理运行 · 共 ${sessions.length} 条 token 记录`;document.getElementById('rows').innerHTML=sessions.map(s=>{let p=parentOf(s),target=s.kind==='main'?s.id:(p?.id||s.parentThreadId),href=target?`codex://threads/${encodeURIComponent(target)}`:'',name=displayName(s);return`<tr title="${esc(s.cwd)}"><td><div class="project">${href?`<a href="${href}" title="在 Codex 中打开">${esc(name)}</a>`:esc(name)}</div><div class="session">${esc(s.id.slice(0,13))}…${s.kind==='subagent'&&target?` · 父任务 ${esc(target.slice(0,8))}`:''}</div></td><td>${new Date(s.lastAt).toLocaleString()}</td><td><span class="source">${s.kind==='subagent'?'子代理运行':'主会话'}</span></td><td>${n(s.usage.input_tokens)}</td><td>${n(s.usage.cached_input_tokens)}</td><td>${n(s.usage.uncached_input_tokens)}</td><td>${n(s.usage.output_tokens)}</td><td><strong>${n(s.usage.total_tokens)}</strong></td></tr>`}).join('')}
['project','kind','from','to'].forEach(id=>document.getElementById(id).addEventListener('change',render));document.getElementById('refresh').onclick=load;load();
</script></body></html>
